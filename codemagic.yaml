workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.medidormetro.app
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.medidormetro.app"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -exec rm {} \;
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Package for App Store
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -config Release \
            -derivedDataPath build \
            -archivePath build/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
          cd ..
    artifacts:
      - ios/build/ipa/**/*.ipa
    publishing:
      email:
        recipients:
          - dfgarcia2908@gmail.com
        notify:
          success: true
          failure: false
